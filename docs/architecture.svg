<text x="40" y="47.2" font-size="32" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Observability Demo - high-level design</text>
<text x="40" y="81.3" font-size="18" fill="#495057" text-anchor="start" xml:space="preserve">Spring Boot apps -&gt; OpenTelemetry Collector -&gt; Loki / Tempo / Prometheus -&gt; Grafana</text>
<text x="1660" y="35.3" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve">Legend</text>
<text x="1750" y="63.9" font-size="14" fill="#1971c2" text-anchor="start" xml:space="preserve">telemetry push (OTLP)</text>
<text x="1750" y="93.9" font-size="14" fill="#e8590c" text-anchor="start" xml:space="preserve">pull / scrape / remote_write</text>
<text x="1750" y="123.9" font-size="14" fill="#2f9e44" text-anchor="start" xml:space="preserve">query (Grafana)</text>
<text x="1750" y="153.9" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">app traffic</text>
<text x="130.0" y="225.65" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">k6 load tests</text>
<text x="130.0" y="243.15" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">steady / spike / stress</text>
<text x="130.0" y="260.65" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(scripts/load.sh)</text>
<text x="130.0" y="365.65" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">chaos scripts</text>
<text x="130.0" y="383.15" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">scripts/chaos.sh</text>
<text x="130.0" y="400.65" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(curl)</text>
<text x="316" y="153.6" font-size="16" fill="#495057" text-anchor="start" xml:space="preserve">Applications (Docker network)</text>
<text x="520.0" y="215.875" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">order-service  :8080</text>
<text x="520.0" y="234.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Spring Boot 3 / Java 21</text>
<text x="520.0" y="253.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">+ OpenTelemetry Java agent</text>
<text x="520.0" y="272.125" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">auto: HTTP, JDBC, logs, JVM</text>
<text x="520.0" y="290.875" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">manual: spans + business metrics</text>
<text x="420.0" y="431.9" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">inventory-service</text>
<text x="420.0" y="449.4" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">:8081</text>
<text x="420.0" y="466.9" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">+ OTel Java agent</text>
<text x="420.0" y="484.4" font-size="14" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(chaos: /admin/chaos)</text>
<text x="625.0" y="439.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">PostgreSQL</text>
<text x="625.0" y="458.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">:5432</text>
<text x="625.0" y="477.125" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">orders table</text>
<text x="228" y="223.05" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">HTTP load</text>
<text x="236" y="451.05" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">chaos</text>
<text x="236" y="467.3" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">APIs</text>
<text x="428" y="349.05" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">HTTP + W3C</text>
<text x="428" y="365.3" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">traceparent</text>
<text x="628" y="361.05" font-size="13" fill="#1e1e1e" text-anchor="start" xml:space="preserve">JDBC</text>
<text x="864" y="273.375" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">OpenTelemetry Collector</text>
<text x="864" y="292.125" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">OTLP :4317 gRPC / :4318 HTTP</text>
<text x="864" y="310.875" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve"></text>
<text x="864" y="329.625" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">receivers:  otlp</text>
<text x="864" y="348.375" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">processors: memory_limiter,</text>
<text x="864" y="367.125" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">            resource, batch</text>
<text x="864" y="385.875" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">exporters:  otlp/tempo,</text>
<text x="864" y="404.625" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">            otlphttp/loki,</text>
<text x="864" y="423.375" font-size="15" fill="#1e1e1e" text-anchor="start" xml:space="preserve">            prometheus (:8889)</text>
<text x="752" y="351.05" font-size="13" fill="#1971c2" text-anchor="start" xml:space="preserve">OTLP/HTTP</text>
<text x="752" y="367.3" font-size="13" fill="#1971c2" text-anchor="start" xml:space="preserve">traces</text>
<text x="752" y="383.55" font-size="13" fill="#1971c2" text-anchor="start" xml:space="preserve">metrics</text>
<text x="752" y="399.8" font-size="13" fill="#1971c2" text-anchor="start" xml:space="preserve">logs</text>
<text x="1390.0" y="159.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Loki  :3100</text>
<text x="1390.0" y="178.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">log storage</text>
<text x="1390.0" y="197.125" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(LogQL)</text>
<text x="1390.0" y="329.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Tempo  :3200</text>
<text x="1390.0" y="348.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">trace storage (TraceQL)</text>
<text x="1390.0" y="367.125" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">+ metrics-generator</text>
<text x="1390.0" y="519.625" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Prometheus  :9090</text>
<text x="1390.0" y="538.375" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">metrics TSDB (PromQL)</text>
<text x="1390.0" y="557.125" font-size="15" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">+ alert rules, exemplars</text>
<text x="1196" y="201.05" font-size="13" fill="#1971c2" text-anchor="start" xml:space="preserve">logs</text>
<text x="1192" y="333.05" font-size="13" fill="#1971c2" text-anchor="start" xml:space="preserve">traces</text>
<text x="1186" y="516.05" font-size="13" fill="#e8590c" text-anchor="start" xml:space="preserve">scrape</text>
<text x="1186" y="532.3" font-size="13" fill="#e8590c" text-anchor="start" xml:space="preserve">:8889</text>
<text x="1400" y="431.05" font-size="13" fill="#e8590c" text-anchor="start" xml:space="preserve">remote_write: span metrics</text>
<text x="1400" y="447.3" font-size="13" fill="#e8590c" text-anchor="start" xml:space="preserve">+ service graph</text>
<text x="1790.0" y="333.6" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">Grafana  :3000</text>
<text x="1790.0" y="353.6" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">dashboards, Explore,</text>
<text x="1790.0" y="373.6" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">alerts, correlations</text>
<text x="1580" y="216.05" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">LogQL</text>
<text x="1565" y="333.05" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">TraceQL</text>
<text x="1590" y="481.05" font-size="13" fill="#2f9e44" text-anchor="start" xml:space="preserve">PromQL</text>
<text x="1790.0" y="593.6" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">You</text>
<text x="1790.0" y="613.6" font-size="16" fill="#1e1e1e" text-anchor="middle" xml:space="preserve">(browser)</text>
<text x="560" y="687.05" font-size="13" fill="#e8590c" text-anchor="start" xml:space="preserve">k6 client-side metrics -&gt; Prometheus (remote_write)</text>
<text x="60" y="767.3" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve">How the three signals are correlated (the whole point of the stack)</text>
<text x="60" y="795.9" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">1. Metrics -&gt; Traces : histograms carry EXEMPLARS (sample trace_id). Click a dot on a latency graph -&gt; open that exact trace in Tempo.</text>
<text x="60" y="813.4" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">2. Logs -&gt; Traces    : the agent puts trace_id/span_id on every log record (Loki structured metadata) -&gt; &#x27;View trace&#x27; button.</text>
<text x="60" y="830.9" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">3. Traces -&gt; Logs    : from any span, jump to Loki filtered by service_name + trace_id.   Traces -&gt; Metrics: span metrics &amp; Service Graph.</text>
<text x="60" y="848.4" font-size="14" fill="#1e1e1e" text-anchor="start" xml:space="preserve">4. Same resource attributes everywhere (service.name, service.version, deployment.environment) = same labels in every backend.</text>
</svg>
