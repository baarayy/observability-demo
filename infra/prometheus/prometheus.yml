global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Application metrics (HTTP, JVM, DB pool, custom business metrics) that the apps
  # PUSHED to the collector over OTLP, re-exposed by the collector's prometheus exporter.
  - job_name: otel-collector-apps
    # keep the job/instance labels set by the exporter (job = service.name) instead of overwriting them
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Health of the telemetry pipeline itself (otelcol_receiver_accepted_spans, otelcol_exporter_send_failed_*...)
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

# Note: two more sources write INTO Prometheus via remote-write (enabled with --web.enable-remote-write-receiver):
#   - Tempo's metrics-generator: traces_spanmetrics_* and traces_service_graph_* (RED metrics derived from spans)
#   - k6 load tests:             k6_* (client-side view of latency / errors)
